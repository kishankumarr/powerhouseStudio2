# GitLab CI/CD for the Powerhouse Studios site (Next.js 16).
#
#   verify  lint · typecheck · format · unit tests · contrast · image links
#   build   next build (starts straight away, in parallel with verify)
#   test    Playwright end-to-end suite against the built app
#   deploy  Vercel: a preview per merge request, production from the default branch
#
# Deploy jobs run only when these CI/CD variables exist (Settings → CI/CD → Variables):
#   VERCEL_TOKEN       Vercel access token (mask it). If you also mark it "protected",
#                      previews for unprotected branches are skipped.
#   VERCEL_ORG_ID      from .vercel/project.json after `npx vercel link`
#   VERCEL_PROJECT_ID  from .vercel/project.json after `npx vercel link`

stages:
  - verify
  - build
  - test
  - deploy

# One pipeline per change: merge requests get MR pipelines, and branch pipelines
# are skipped while an MR is open for that branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  HUSKY: '0' # no git hooks in CI
  NEXT_TELEMETRY_DISABLED: '1'
  VERCEL_CLI_VERSION: '61.1.0'

default:
  image: node:22-bookworm-slim
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  cache: &npm_cache
    key:
      prefix: npm
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

# ---------------------------------------------------------------------------
# verify
# ---------------------------------------------------------------------------

lint:
  stage: verify
  script:
    - npm run lint

typecheck:
  stage: verify
  script:
    - npx next typegen # route types + next-env.d.ts (both gitignored)
    - npm run typecheck

format:
  stage: verify
  script:
    - npm run format:check

unit-tests:
  stage: verify
  script:
    - npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/unit-junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/unit-junit.xml

contrast:
  stage: verify
  cache: []
  before_script: [] # plain Node script, no dependencies
  script:
    - npm run check:contrast

# Checks the Unsplash URLs are still live. Non-blocking: it depends on a third party.
image-links:
  stage: verify
  cache: []
  before_script: []
  script:
    - npm run check:images
  allow_failure: true

# ---------------------------------------------------------------------------
# build
# ---------------------------------------------------------------------------

build:
  stage: build
  needs: []
  cache:
    - *npm_cache
    - key: next-$CI_COMMIT_REF_SLUG
      paths:
        - .next/cache/
  script:
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - .next/
    exclude:
      - .next/cache/**/*
      - .next/dev/**/*

# ---------------------------------------------------------------------------
# test
# ---------------------------------------------------------------------------

# The image version must match @playwright/test in package.json (browsers included).
e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  needs:
    - job: build
      artifacts: true
  variables:
    E2E_PREBUILT: '1' # start the server from the build artifact instead of rebuilding
  script:
    - npx playwright test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: reports/e2e-junit.xml

# ---------------------------------------------------------------------------
# deploy (Vercel)
# ---------------------------------------------------------------------------

.vercel:
  stage: deploy
  needs:
    - lint
    - typecheck
    - format
    - unit-tests
    - contrast
    - e2e
  script:
    - npx --yes vercel@$VERCEL_CLI_VERSION pull --yes --environment=$VERCEL_ENV --token="$VERCEL_TOKEN"
    - npx --yes vercel@$VERCEL_CLI_VERSION build $VERCEL_BUILD_FLAGS --token="$VERCEL_TOKEN"
    - DEPLOY_URL=$(npx --yes vercel@$VERCEL_CLI_VERSION deploy --prebuilt $VERCEL_BUILD_FLAGS --token="$VERCEL_TOKEN")
    - echo "Deployed to $DEPLOY_URL"
    - echo "DEPLOY_URL=$DEPLOY_URL" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

deploy-preview:
  extends: .vercel
  variables:
    VERCEL_ENV: preview
    VERCEL_BUILD_FLAGS: ''
  rules:
    - if: $VERCEL_TOKEN == null || $VERCEL_TOKEN == ""
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: $DEPLOY_URL
    auto_stop_in: 2 weeks

deploy-production:
  extends: .vercel
  interruptible: false # never cancel a production deploy halfway
  resource_group: production # one production deploy at a time
  variables:
    VERCEL_ENV: production
    VERCEL_BUILD_FLAGS: '--prod'
  rules:
    - if: $VERCEL_TOKEN == null || $VERCEL_TOKEN == ""
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://powerhousestudios.in
